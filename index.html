<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ECHO</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECHO">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg: #07080d; --ink: #eef1ff; --dim: #8a90ad; --gold: #ffd166; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(7,8,13,.72), rgba(7,8,13,.92));
    transition: opacity .25s ease;
  }
  #overlay.hidden { opacity: 0; }
  h1 {
    margin: 0; font-size: clamp(56px, 16vw, 132px); letter-spacing: .18em; padding-left: .18em; font-weight: 800; line-height: 1;
    /* --e runs 0 to 1 during the intro: each ghost that lands pushes the coloured echoes further out */
    --e: 1;
    text-shadow: calc(-6px * var(--e)) 0 0 rgba(90,200,255,.45), calc(-12px * var(--e)) 0 0 rgba(255,90,200,.28), calc(-18px * var(--e)) 0 0 rgba(255,209,102,.16);
  }
  #overlay > * { transition: opacity .45s ease; }
  #overlay > h1 { transition: opacity .12s ease, text-shadow .14s ease; }
  #overlay.intro { background: none; }
  #overlay.intro > * { opacity: 0; }
  #overlay.intro > h1.show { opacity: 1; animation: pop .28s cubic-bezier(.2, 1.5, .4, 1); }
  #overlay.intro button, #overlay.intro input { pointer-events: none; }
  @keyframes pop { from { transform: scale(.55); } to { transform: scale(1); } }
  #tagline { margin: 0; max-width: 30ch; font-size: clamp(15px, 2.6vw, 19px); line-height: 1.45; color: var(--dim); }
  #result { margin: 0; font-size: clamp(18px, 3.4vw, 26px); font-weight: 700; min-height: 1.2em; }
  #result b { color: var(--gold); }
  #cta { margin: 10px 0 0; font-size: clamp(14px, 2.4vw, 17px); letter-spacing: .12em; text-transform: uppercase; animation: pulse 1.4s ease-in-out infinite; }
  #help { margin: 0; font-size: 13px; color: var(--dim); }
  #mute, #pause {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 50%; background: rgba(255,255,255,.05);
    color: var(--ink); font-size: 17px; cursor: pointer; padding: 0;
  }
  #modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
  #modes button { pointer-events: auto; font: inherit; color: var(--ink); cursor: pointer; }
  #modes button {
    width: 172px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  #modes button b { font-size: 16px; letter-spacing: .06em; }
  #modes button span { font-size: 12px; line-height: 1.3; color: var(--dim); }
  #modes button.sel { border-color: var(--gold); background: rgba(255,209,102,.1); }
  #overlay.over h1 { font-size: clamp(34px, 9vw, 60px); }
  #board { width: min(330px, 86vw); display: flex; flex-direction: column; gap: 7px; }
  #board[hidden], #tagline[hidden], #rows[hidden], #note[hidden] { display: none; }
  #note, #news { margin: 0; font-size: 12px; color: var(--gold); }
  #news { font-size: 14px; max-width: 34ch; }
  #news[hidden], #challengeBtn[hidden] { display: none; }
  #challengeBtn {
    pointer-events: auto; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: #1a1405;
    background: var(--gold); border: 0; border-radius: 999px; padding: 8px 18px;
  }
  #install {
    pointer-events: auto; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
    background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 14px;
  }
  #install[hidden], #overlay.over #install { display: none; }
  #looks { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #swatches { display: flex; gap: 9px; }
  #swatches button {
    pointer-events: auto; cursor: pointer; width: 26px; height: 26px; padding: 0; border-radius: 50%;
    background: #fff; border: 4px solid var(--c); box-shadow: 0 0 0 2px transparent;
  }
  #swatches button.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold); }
  #swatches button.locked { background: none; border: 2px dashed rgba(255,255,255,.3); }
  #lookNote { margin: 0; font-size: 12px; color: var(--dim); min-height: 1.3em; }
  #boardTitle { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #rows {
    list-style: none; margin: 0; padding: 0; overflow: hidden; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
  }
  #rows li { display: grid; grid-template-columns: 1.8em 1fr auto 5.2em; gap: 10px; align-items: baseline; padding: 5px 12px; font-size: 14px; text-align: left; }
  #rows li:nth-child(odd) { background: rgba(255,255,255,.035); }
  #rows .rank, #rows .detail { color: var(--dim); }
  #rows .detail { font-size: 12px; text-align: right; }
  #rows .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rows .pts { font-weight: 700; }
  #rows li.me, #rows li.me .rank, #rows li.me .detail { color: var(--gold); }
  #rows li.me { font-weight: 700; }
  #nameRow { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--dim); }
  #name {
    pointer-events: auto; font: inherit; font-size: 16px; width: 9.5em; text-align: center; color: var(--ink);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 3px 8px;
  }
  #name:focus { outline: none; border-color: var(--gold); }
  #overlay.hidden button, #overlay.hidden input { pointer-events: none; }
  @media (max-width: 580px) {
    h1 { font-size: clamp(48px, 15vw, 88px); }
    #modes { flex-wrap: nowrap; gap: 6px; width: 100%; }
    #modes button { flex: 1 1 0; width: auto; min-width: 0; padding: 8px 4px; }
    #modes button b { font-size: 14px; }
    #modes button span { font-size: 11px; }
    #overlay.over #modes button span { display: none; }
    #overlay.over #help { display: none; }
  }
  @media (max-height: 520px) {
    h1 { font-size: 46px; }
    #overlay { gap: 7px; padding: 10px; }
    #tagline, #help { display: none; }
    #overlay.over h1 { display: none; }
    #rows li:nth-child(n+4) { display: none; }
    #modes button { padding: 6px 10px; }
  }
  #pause { right: 60px; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
  #pause[hidden] { display: none; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>ECHO</h1>
  <p id="result"></p>
  <p id="news" hidden></p>
  <p id="tagline"></p>
  <div id="modes">
    <button data-mode="levels"><b></b><span></span></button>
    <button data-mode="endless"><b></b><span></span></button>
    <button data-mode="daily"><b></b><span></span></button>
  </div>
  <div id="board" hidden>
    <div id="boardTitle"></div>
    <ol id="rows"></ol>
    <p id="note" hidden></p>
    <label id="nameRow">Your name <input id="name" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOU"></label>
  </div>
  <button id="challengeBtn" hidden>Challenge a friend</button>
  <div id="looks">
    <div id="swatches"></div>
    <p id="lookNote"></p>
  </div>
  <p id="cta"></p>
  <button id="install" hidden>Add to home screen</button>
  <p id="help"></p>
</div>
<button id="mute" aria-label="Toggle sound">♪</button>
<button id="pause" aria-label="Pause" hidden>II</button>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const STEP = 1 / 60;          // fixed simulation step, so ghost replays are exact
  const SPEED = 310;            // player speed, arena units / second
  const R = 11;                 // player and ghost radius
  const HIT = 17;               // ghost collision distance (a little forgiving)
  const GEM_R = 12;
  const PICKUP = 27;
  const SPAWN_TIME = 0.8;       // seconds a ghost is harmless while it materialises
  const STICK = 46;             // touch joystick radius in CSS pixels
  const MAX_MULT = 9;
  const NEAR = 36;              // skimming a ghost closer than this (and surviving) is a near miss
  const NEAR_COOLDOWN = 1.5;    // seconds before the same ghost can pay out again
  const DASH_TIME = 0.16;
  const DASH_SPEED = SPEED * 3.4;
  const DASH_CD = 2;
  const DASH_GRACE = 0.06;      // extra invulnerability after a dash ends
  const CYAN = '#7fe7ff';
  const HISTORY = 48;           // steps of play kept for the death replay (0.8 s)
  const REPLAY_HOLD = 0.45;     // seconds the impact is held before the replay rewinds

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const elResult = document.getElementById('result');
  const elTagline = document.getElementById('tagline');
  const elCta = document.getElementById('cta');
  const elHelp = document.getElementById('help');
  const elMute = document.getElementById('mute');
  const elPause = document.getElementById('pause');
  const elBoard = document.getElementById('board');
  const elBoardTitle = document.getElementById('boardTitle');
  const elRows = document.getElementById('rows');
  const elName = document.getElementById('name');
  const elNote = document.getElementById('note');
  const elNews = document.getElementById('news');
  const elInstall = document.getElementById('install');
  const elChallenge = document.getElementById('challengeBtn');
  const elSwatches = document.getElementById('swatches');
  const elLookNote = document.getElementById('lookNote');
  const modeButtons = [...document.querySelectorAll('#modes button')];

  const isTouch = matchMedia('(pointer: coarse)').matches;

  // ---------- persistence ----------
  const memory = {};            // fallback so bests still show for the session when storage is blocked
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); if (v !== null) return v; } catch (e) { /* private mode etc. */ }
    return key in memory ? memory[key] : fallback;
  }
  function save(key, value) {
    memory[key] = value;
    try { localStorage.setItem(key, value); } catch (e) { /* private mode etc. */ }
  }

  // ---------- state ----------
  let W = 960, H = 600;         // arena size in logical units
  let vw = 0, vh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  let state = 'title';          // 'title' | 'play' | 'dead'
  let paused = false;
  let score = 0;
  let best = 0;
  let muted = load('echo.muted', '0') === '1';
  let player, gem, ghosts, path, particles, trail, floats;
  let mult = 1, dashT = 0, safeT = 0, dashCd = 0, lastDir = [1, 0], dashDir = [1, 0], lastTap = 0;

  const MODES = ['levels', 'endless', 'daily'];
  const MODE_NAMES = { levels: 'Levels', endless: 'Endless', daily: 'Daily' };
  let mode = load('echo.mode', 'levels');
  if (!MODES.includes(mode)) mode = 'levels';
  let bestLevel = +load('echo.level', 0) || 0;
  let level = 1, levelGems = 0, rate = 1, spawnTime = SPAWN_TIME;
  let banner = null, lastRun = null, runDate = '', rng = Math.random, prevU = 0.5, prevV = 0.5;

  // Global leaderboard. Fill in both values from the Supabase project (Settings → API) to switch
  // it on; the key is the public "publishable"/"anon" one and is safe to ship. Left empty, the
  // leaderboard stays on this device only. The table and function it needs are in supabase.sql.
  const SUPABASE_URL = 'https://pzkuxmotrfpbltnfdgkh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wYQryMWxFGqOJwjDUOPibw_L0ezn01I';
  const REMOTE = !!(SUPABASE_URL && SUPABASE_KEY);
  const REMOTE_HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  const MIN_NAME = 2;           // letters needed before a score is posted globally
  const remoteCache = {};       // board key -> { rows, at, loading, failed }

  // Rows for a board from the server, or null while they load or when the server can't be reached.
  function remoteBoard(m, date) {
    const key = boardKey(m, date), c = remoteCache[key];
    if (!c || (!c.loading && performance.now() - c.at > 30000)) fetchRemote(m, date);
    return remoteCache[key].rows;
  }
  async function fetchRemote(m, date) {
    const key = boardKey(m, date), prev = remoteCache[key];
    remoteCache[key] = { rows: prev ? prev.rows : null, at: performance.now(), loading: true, failed: false };
    let rows = null;
    try {
      const q = `select=name,score,level,echoes&mode=eq.${m}&day=eq.${m === 'daily' ? date : ''}` +
        `&order=score.desc,updated_at.asc&limit=${BOARD_KEEP}`;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?${q}`, { headers: REMOTE_HEADERS });
      if (res.ok) rows = await res.json();
    } catch (e) { /* offline */ }
    remoteCache[key] = { rows: Array.isArray(rows) ? rows : null, at: performance.now(), loading: false, failed: !Array.isArray(rows) };
    if (!overlay.classList.contains('hidden')) renderBoard();
  }
  // Posts the run just played. The server keeps one row per name and only ever raises its score.
  async function postScore() {
    const r = lastRun;
    if (!REMOTE || !r || r.score <= 0 || playerName.length < MIN_NAME || r.posted === nameKey(playerName)) return;
    r.posted = nameKey(playerName);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_score`, {
        method: 'POST',
        headers: { ...REMOTE_HEADERS, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_mode: r.mode, p_day: r.date, p_name: playerName, p_score: r.score, p_level: r.level, p_echoes: r.echoes }),
      });
      if (!res.ok) throw new Error('rejected');
      fetchRemote(r.mode, r.date);
    } catch (e) { r.posted = null; }
  }

  // Scores are also kept on this device: one board per mode, and one per day for the daily.
  const BOARD_KEEP = 10, BOARD_SHOW = 5;
  let playerName = load('echo.name', '');
  let lastEntry = null, lastEntryKey = '';
  const boardKey = (m, date) => m === 'daily' ? 'echo.lb.daily.' + date : 'echo.lb.' + m;
  const nameKey = n => String(n).trim().toUpperCase();
  // Best first, one row per name (their highest score), capped.
  function tidyBoard(list) {
    const seen = new Set();
    return list.slice().sort((a, b) => b.score - a.score || a.id - b.id)
      .filter(e => !seen.has(nameKey(e.name)) && seen.add(nameKey(e.name)))
      .slice(0, BOARD_KEEP);
  }
  function loadBoard(key) {
    try { const a = JSON.parse(load(key, '[]')); return Array.isArray(a) ? tidyBoard(a) : []; } catch (e) { return []; }
  }

  // The daily challenge rolls over at midnight UTC so it is the same day for everyone.
  const today = () => new Date().toISOString().slice(0, 10);
  const bestKey = (m, date) => m === 'levels' ? 'echo.best.levels' : m === 'endless' ? 'echo.best' : 'echo.daily.' + date;
  const getBest = m => +load(bestKey(m, today()), 0) || 0;

  const yesterday = () => new Date(Date.now() - 864e5).toISOString().slice(0, 10);

  // Daily streak: consecutive days with a scoring Daily run. The best streak ever unlocks looks.
  let streak = { last: '', count: 0, best: 0 };
  try { streak = Object.assign(streak, JSON.parse(load('echo.streak', '{}'))); } catch (e) { /* keep defaults */ }
  const streakNow = () => streak.last === today() || streak.last === yesterday() ? streak.count : 0;
  function bumpStreak(date) {
    if (streak.last === date) return;
    streak.count = streak.last === yesterday() ? streak.count + 1 : 1;
    streak.last = date;
    streak.best = Math.max(streak.best, streak.count);
    save('echo.streak', JSON.stringify(streak));
  }

  // Looks tint the player's rim, glow and trail. The centre stays white so you never pass for a ghost.
  const LOOKS = [
    { id: 'classic', name: 'Classic', color: '#ffffff', need: '', ok: () => true },
    { id: 'comet', name: 'Comet', color: '#9db4ff', need: 'reach level 3 in Levels', ok: () => bestLevel >= 3, long: true },
    { id: 'rose', name: 'Rose', color: '#ff7eb6', need: 'score 40 in Endless', ok: () => getBest('endless') >= 40 },
    { id: 'ember', name: 'Ember', color: '#ff9f43', need: 'play the Daily 2 days in a row', ok: () => streak.best >= 2 },
    { id: 'mint', name: 'Mint', color: '#6ee7a8', need: 'play the Daily 3 days in a row', ok: () => streak.best >= 3 },
    { id: 'violet', name: 'Violet', color: '#b18cff', need: 'play the Daily 5 days in a row', ok: () => streak.best >= 5 },
    { id: 'gold', name: 'Gold', color: '#ffd166', need: 'play the Daily 7 days in a row', ok: () => streak.best >= 7, sparkle: true },
  ];
  let look = LOOKS.find(l => l.id === load('echo.look', 'classic') && l.ok()) || LOOKS[0];
  const unlockedIds = () => LOOKS.filter(l => l.ok()).map(l => l.id);

  // A challenge link looks like  …/#beat=endless.42.DEBRAH  (daily ones also carry their date).
  let challenge = null, challengeExpired = false;
  try {
    const m = /^#beat=(levels|endless|daily)\.(?:(\d{4}-\d\d-\d\d)\.)?(\d{1,6})\.(.*)$/.exec(decodeURIComponent(location.hash));
    if (m && +m[3] > 0) {
      const name = m[4].replace(/[^\w \-]/g, '').trim().slice(0, 10) || 'A friend';
      if (m[1] === 'daily' && m[2] !== today()) challengeExpired = true;
      else { challenge = { mode: m[1], score: +m[3], name }; mode = m[1]; }
    }
  } catch (e) { /* malformed link: ignore */ }
  const activeChallenge = () => challenge && challenge.mode === mode ? challenge : null;

  // First-run guide: four short prompts pinned to the thing they describe. Shown once per device.
  const TUT_LINES = {
    1: [isTouch ? 'Drag anywhere to move' : 'Arrow keys to move', 'Grab the gem'],
    2: ['This ghost replays your path', "Don't touch it"],
    3: ['Grab gems before the ring empties', 'to build a combo'],
    4: [isTouch ? 'Double-tap to dash' : 'Space to dash', 'straight through a ghost'],
  };
  const TUT_SECONDS = 4;        // how long each prompt after the first stays up
  let tut = load('echo.tut', '') ? null : { step: 1, t: 0 };
  function endTutorial() { tut = null; save('echo.tut', '1'); }

  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    let a = h >>> 0;
    return () => {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Levels mode: each level needs more gems; later levels also speed the ghosts up.
  const gemsNeeded = () => Math.min(10, 4 + level);
  function setLevel(n) {
    level = n; levelGems = 0;
    // Levels 1-3 run at normal speed; from level 4 ghosts gain 5% a level, up to 35% faster.
    const k = mode === 'levels' ? Math.max(0, n - 3) : 0;
    rate = Math.min(1.35, 1 + 0.05 * k);
    spawnTime = Math.max(0.5, SPAWN_TIME - 0.03 * k);
  }
  let shake = 0, deadFor = 0, killer = -1, time = 0, scorePop = 0, newBest = false;
  let history = [], replay = null, overShown = false, overAt = 0;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    scale = Math.min(vw / W, vh / H) * 0.94;
    ox = (vw - W * scale) / 2; oy = (vh - H * scale) / 2;
  }

  function reset() {
    // Pick the arena shape to suit the screen; fixed for the whole run so recordings stay valid.
    if (window.innerWidth >= window.innerHeight) { W = 960; H = 600; } else { W = 600; H = 960; }
    layout();
    player = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    ghosts = []; path = []; particles = []; trail = []; floats = [];
    mult = 1; dashT = 0; safeT = 0; dashCd = 0; lastDir = [1, 0];
    paused = false;
    runDate = today();
    best = +load(bestKey(mode, runDate), 0) || 0;
    rng = seeded('echo-' + runDate); prevU = prevV = 0.5;
    setLevel(1);
    banner = mode === 'levels' ? { text: 'LEVEL 1', sub: `Collect ${gemsNeeded()} gems to clear the board`, age: 0 }
           : mode === 'daily' ? { text: 'DAILY', sub: runDate, age: 0 } : null;
    if (tut) { tut.step = 1; tut.t = 0; banner = null; }   // the guide does the talking on a first run
    score = 0; shake = 0; deadFor = 0; killer = -1; scorePop = 0; newBest = false;
    history = []; replay = null; overShown = false;
    placeGem();
  }

  function placeGem() {
    const m = 46;
    let gx = 0, gy = 0;
    if (mode === 'daily') {
      // Seeded and independent of how you play: each gem is placed relative to the previous one.
      let u = 0, v = 0;
      for (let i = 0; i < 60; i++) {
        u = rng(); v = rng();
        if (Math.hypot(u - prevU, v - prevV) > 0.38) break;
      }
      prevU = u; prevV = v;
      gx = m + u * (W - 2 * m); gy = m + v * (H - 2 * m);
    } else {
      for (let i = 0; i < 60; i++) {
        gx = m + Math.random() * (W - 2 * m);
        gy = m + Math.random() * (H - 2 * m);
        if (Math.hypot(gx - player.x, gy - player.y) > 290) break;
      }
    }
    // The combo window scales with how far away the gem landed.
    const limit = Math.hypot(gx - player.x, gy - player.y) / SPEED * 1.6 + 1.3;
    gem = { x: gx, y: gy, born: time, limit, left: limit, expired: false };
  }

  // ---------- input ----------
  const keys = new Set();
  const stick = { on: false, id: -1, sx: 0, sy: 0, x: 0, y: 0 };
  const MOVE_KEYS = {
    ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1],
  };

  addEventListener('keydown', e => {
    if (e.target === elName) {   // typing a name must not start runs, switch modes or mute
      if (e.code === 'Enter' || e.code === 'Escape') elName.blur();
      return;
    }
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) togglePause(); return; }
    if (paused && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); if (!e.repeat) togglePause(); return; }
    const isMove = e.code in MOVE_KEYS;
    const isDash = e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight';
    const isStart = e.code === 'Space' || e.code === 'Enter';
    const digit = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code);
    if (digit >= 0 && state !== 'play') { selectMode(MODES[digit]); return; }
    if (isMove || isDash || isStart) {
      e.preventDefault();
      if (isMove) keys.add(e.code);
      if (!e.repeat && !(isStart && tryStart()) && isDash) dash();
    }
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); stick.on = false; pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (paused) { togglePause(); return; }
    const started = tryStart();
    // Double-tap, or a tap with a second finger while steering, dashes.
    const now = performance.now();
    if (!started && (stick.on || now - lastTap < 300)) dash();
    lastTap = now;
    if (stick.on) return;
    stick.on = true; stick.id = e.pointerId;
    stick.sx = stick.x = e.clientX; stick.sy = stick.y = e.clientY;
  });
  addEventListener('pointermove', e => {
    if (!stick.on || e.pointerId !== stick.id) return;
    stick.x = e.clientX; stick.y = e.clientY;
    // Let the stick's origin trail the finger so reversing direction stays quick.
    const dx = stick.x - stick.sx, dy = stick.y - stick.sy, d = Math.hypot(dx, dy);
    if (d > STICK) { stick.sx += dx / d * (d - STICK); stick.sy += dy / d * (d - STICK); }
  });
  const release = e => { if (e.pointerId === stick.id) stick.on = false; };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('contextmenu', e => e.preventDefault());

  function inputDir() {
    let x = 0, y = 0;
    for (const k of keys) { const d = MOVE_KEYS[k]; if (d) { x += d[0]; y += d[1]; } }
    if (x || y) { const l = Math.hypot(x, y); return [x / l, y / l]; }
    if (stick.on) {
      const dx = stick.x - stick.sx, dy = stick.y - stick.sy, d = Math.hypot(dx, dy);
      if (d > 6) { const p = Math.min(1, d / (STICK * 0.7)); return [dx / d * p, dy / d * p]; }
    }
    return [0, 0];
  }

  function tryStart() {
    initAudio();
    if (intro) {                             // a press during the intro skips to the menu
      const wasPlaying = state === 'intro';
      endIntro();
      if (wasPlaying) return true;
    }
    if (state === 'dead' && !overShown) {   // a press during the replay skips it rather than restarting
      if (deadFor > 0.5) showGameOver();
      return true;
    }
    if (state === 'title' || (state === 'dead' && deadFor - overAt > 0.3)) {
      reset();
      state = 'play';
      stepNo = 0; runGems = 0;
      syncUI();
      overlay.classList.add('hidden');
      elName.blur();
      blip(330, 0.09, 'triangle', 0.12);
      return true;
    }
    return false;
  }

  function togglePause() {
    if (state !== 'play') return;
    paused = !paused;
    keys.clear(); stick.on = false;
    syncUI();
  }
  function pause() { if (!paused) togglePause(); }
  // Keeps the pause button and the music level in step with the game state.
  function syncUI() {
    elPause.hidden = state !== 'play';
    elPause.textContent = paused ? '▶' : 'II';
    elPause.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    if (musicGain) musicGain.gain.setTargetAtTime(state === 'play' && !paused && !muted ? 1 : 0, ac.currentTime, 0.06);
  }
  elPause.addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });

  function dash() {
    if (state !== 'play' || paused || dashCd > 0 || dashT > 0) return;
    dashDir = lastDir;
    dashT = DASH_TIME; safeT = DASH_TIME + DASH_GRACE; dashCd = DASH_CD;
    burst(player.x, player.y, CYAN, 8, 130);
    blip(720, 0.18, 'sine', 0.12, 180);
  }

  // ---------- audio ----------
  let ac = null;
  const SCALE = [0, 2, 4, 7, 9];   // major pentatonic, climbs as the score does

  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { ac = new AC(); } catch (e) { ac = null; } }
    if (!ac) return;
    musicGain = ac.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }

  // ---------- music ----------
  // A four-bar loop in the same key as the pickup notes. Each ghost on the board switches on
  // another layer, so the track fills out as the arena does.
  const STEP_DUR = 60 / 112 / 4;   // one 16th note at 112 bpm
  const CHORDS = [
    { bass: 98.00, tones: [67, 71, 74, 79] },    // G
    { bass: 82.41, tones: [64, 67, 71, 76] },    // Em
    { bass: 130.81, tones: [60, 64, 67, 72] },   // C
    { bass: 146.83, tones: [62, 66, 69, 74] },   // D
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  let musicGain = null, noiseBuf = null, nextStep = 0, stepNo = 0, runGems = 0;

  function voice(t, freq, dur, type, vol, slideTo, cutoff, attack) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = o;
    if (cutoff) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = cutoff;
      o.connect(f); out = f;
    }
    out.connect(g).connect(musicGain);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function hit(t, dur, vol, highpass) {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'highpass'; f.frequency.value = highpass;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(musicGain);
    src.start(t, Math.random() * 0.5, dur + 0.02);
  }

  function scheduleStep(n, t) {
    // Counts gems collected this run rather than ghosts on the board, so clearing a level in
    // Levels mode keeps every layer playing instead of dropping back to the bare beat.
    const layers = runGems;
    const s = n % 16, chord = CHORDS[Math.floor(n / 16) % 4];
    if (s % 8 === 0) voice(t, chord.bass, STEP_DUR * 6, 'triangle', 0.2);                              // bass
    if (layers >= 1 && s % 4 === 0) voice(t, 120, 0.16, 'sine', 0.32, 45);                             // kick
    if (layers >= 2 && s % 4 === 2) hit(t, 0.04, 0.07, 7000);                                          // off-beat hat
    if (layers >= 3 && s % 2 === 0) voice(t, midi(chord.tones[ARP[s / 2]]), STEP_DUR * 1.8, 'triangle', 0.07);   // arpeggio
    if (layers >= 5 && s % 8 === 4) hit(t, 0.13, 0.12, 1800);                                          // snare
    if (layers >= 7 && s === 0) {                                                                      // pad
      for (let i = 0; i < 3; i++) voice(t, midi(chord.tones[i] - 12), STEP_DUR * 16, 'sawtooth', 0.035, 0, 900, 0.25);
    }
    if (layers >= 9 && s % 2 === 1) voice(t, midi(chord.tones[(n * 3) % 4] + 12), STEP_DUR * 0.9, 'square', 0.025);   // lead
    if (layers >= 12 && s % 4 === 3) hit(t, 0.03, 0.05, 9000);                                         // busy hats
  }
  function musicTick() {
    if (!ac || muted || paused || state !== 'play') return;
    if (nextStep < ac.currentTime) nextStep = ac.currentTime + 0.05;
    while (nextStep < ac.currentTime + 0.15) {
      scheduleStep(stepNo++, nextStep);
      nextStep += STEP_DUR;
    }
  }
  function blip(freq, dur, type, vol, slideTo) {
    if (!ac || muted) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function collectSound() {
    const n = (ghosts.length - 1) % 15;
    const semis = SCALE[n % 5] + 12 * Math.floor(n / 5);
    const f = 392 * Math.pow(2, semis / 12);
    blip(f, 0.16, 'triangle', 0.16);
    blip(f * 1.5, 0.22, 'sine', 0.08);
  }
  function deathSound() {
    blip(300, 0.55, 'sawtooth', 0.16, 40);
    blip(92, 0.5, 'square', 0.1, 30);
  }
  function toggleMute() {
    muted = !muted;
    save('echo.muted', muted ? '1' : '0');
    elMute.textContent = muted ? '×' : '♪';
    syncUI();
  }
  elMute.textContent = muted ? '×' : '♪';
  elMute.addEventListener('click', e => { initAudio(); toggleMute(); e.currentTarget.blur(); });

  // ---------- simulation ----------
  const ghostHue = i => (195 + i * 47) % 360;

  function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, age: 0, color });
    }
  }

  function float(x, y, text, color) {
    floats.push({ x, y, text, color, age: 0 });
  }

  function step() {
    if (paused) return;
    time += STEP;
    shake = Math.max(0, shake - STEP * 28);
    scorePop = Math.max(0, scorePop - STEP * 3);

    if (banner && (banner.age += STEP) > 2.2) banner = null;

    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.age += STEP; f.y -= 34 * STEP;
      if (f.age >= 0.9) floats.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += STEP;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * STEP; p.y += p.vy * STEP;
      p.vx *= 0.96; p.vy *= 0.96;
    }

    if (state === 'dead') { deadFor += STEP; stepReplay(); return; }
    if (state !== 'play') return;

    // Player
    const [dx, dy] = inputDir();
    if (dx || dy) { const l = Math.hypot(dx, dy); lastDir = [dx / l, dy / l]; }
    dashCd = Math.max(0, dashCd - STEP);
    safeT = Math.max(0, safeT - STEP);
    if (dashT > 0) {
      dashT -= STEP;
      player.vx = dashDir[0] * DASH_SPEED; player.vy = dashDir[1] * DASH_SPEED;
    } else {
      player.vx += (dx * SPEED - player.vx) * 0.32;
      player.vy += (dy * SPEED - player.vy) * 0.32;
    }
    player.x = Math.max(R, Math.min(W - R, player.x + player.vx * STEP));
    player.y = Math.max(R, Math.min(H - R, player.y + player.vy * STEP));
    path.push(player.x, player.y);
    trail.push(player.x, player.y);
    if (trail.length > (look.long ? 64 : 28)) trail.splice(0, 2);
    if (look.sparkle && Math.random() < 0.3) {
      particles.push({ x: player.x, y: player.y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 0.5, age: 0, color: look.color });
    }

    // Ghosts replay their recorded segment on a loop
    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i], p = g.path;
      if (g.spawn > 0) { g.spawn -= STEP; continue; }
      g.t += rate;
      if (g.t >= p.length / 2 - 1) {
        burst(g.x, g.y, `hsl(${ghostHue(i)},90%,65%)`, 6, 90);
        g.t = 0; g.x = p[0]; g.y = p[1]; g.spawn = spawnTime; g.close = false;
        continue;
      }
      const a = Math.floor(g.t) * 2, f = g.t - Math.floor(g.t);
      g.x = p[a] + (p[a + 2] - p[a]) * f;
      g.y = p[a + 1] + (p[a + 3] - p[a + 1]) * f;
      const d = Math.hypot(g.x - player.x, g.y - player.y);
      if (safeT > 0) { g.close = false; continue; }   // dashing passes straight through
      if (d < HIT) { die(i); return; }
      if (d < NEAR) g.close = true;
      else if (g.close && d > NEAR + 6) {
        // Paid on the way out, so only a survived graze counts.
        g.close = false;
        if (time >= g.nearAt) {
          g.nearAt = time + NEAR_COOLDOWN;
          score += mult; scorePop = 0.5;
          float(player.x, player.y - 20, `close! +${mult}`, `hsl(${ghostHue(i)},90%,72%)`);
          burst(player.x, player.y, `hsl(${ghostHue(i)},90%,72%)`, 8, 160);
          blip(1050, 0.07, 'square', 0.05);
        }
      }
    }

    // First-run guide: after the first gem, each prompt gets a few seconds
    if (tut && tut.step > 1 && (tut.t += STEP) > TUT_SECONDS) {
      tut.t = 0;
      if (++tut.step > 4) endTutorial();
    }

    // Combo window
    gem.left -= STEP;
    if (gem.left <= 0 && !gem.expired) {
      gem.expired = true;
      if (mult > 1) {
        mult = 1;
        float(gem.x, gem.y - 26, 'combo lost', 'rgba(255,255,255,.6)');
        blip(190, 0.2, 'triangle', 0.1, 120);
      }
    }

    // Gem
    if (Math.hypot(gem.x - player.x, gem.y - player.y) < PICKUP) {
      score += mult; scorePop = 1; runGems++;
      if (tut && tut.step === 1) { tut.step = 2; tut.t = 0; }
      float(gem.x, gem.y - 26, `+${mult}`, '#ffd166');
      if (!gem.expired) mult = Math.min(MAX_MULT, mult + 1);
      burst(gem.x, gem.y, '#ffd166', 18, 260);
      ghosts.push({ path, t: 0, x: path[0], y: path[1], spawn: spawnTime, close: false, nearAt: 0 });
      path = [];
      collectSound();
      if (mode === 'levels' && ++levelGems >= gemsNeeded()) clearLevel();
      placeGem();
    }
    snapshot();
  }

  // ---------- death replay ----------
  // Every step of play is recorded; on death the last moments are played back in slow motion.
  function snapshot() {
    const gs = new Float32Array(ghosts.length * 4);
    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i];
      gs[i * 4] = g.x; gs[i * 4 + 1] = g.y; gs[i * 4 + 2] = g.spawn; gs[i * 4 + 3] = g.t;
    }
    history.push({ px: player.x, py: player.y, dash: safeT > 0, gemX: gem.x, gemY: gem.y, gs });
    if (history.length > HISTORY) history.shift();
  }

  function stepReplay() {
    const r = replay;
    if (overShown) return;
    if (r.done) { if ((r.doneFor += STEP) > 0.45) showGameOver(); return; }
    if (deadFor < REPLAY_HOLD) return;
    const last = history.length - 1;
    if (!r.started) {
      r.started = true; particles.length = 0; floats.length = 0; shake = 0;
      blip(520, 0.3, 'sine', 0.07, 130);   // rewind
    }
    // Starts at a little over half speed and slows to a crawl as the hit approaches.
    r.pos = Math.min(last, r.pos + 0.62 - 0.45 * (last > 0 ? r.pos / last : 1));
    if (r.pos >= last) {
      r.done = true; r.doneFor = 0; shake = 14;
      burst(player.x, player.y, '#ffffff', 40, 420);
      burst(player.x, player.y, `hsl(${ghostHue(killer)},90%,65%)`, 24, 300);
      blip(150, 0.45, 'sawtooth', 0.14, 35);
    }
  }

  // What the replay should show right now, or null when the live scene should be drawn.
  function replayView() {
    const r = replay;
    if (state !== 'dead' || !r || !r.started || r.done) return null;
    const last = history.length - 1, i = Math.floor(r.pos);
    return { a: history[i], b: history[Math.min(i + 1, last)], f: r.pos - i, prog: last > 0 ? r.pos / last : 1 };
  }

  function clearLevel() {
    const bonus = 10 * level;
    score += bonus;
    ghosts.forEach((g, i) => burst(g.x, g.y, `hsl(${ghostHue(i)},90%,65%)`, 14, 240));
    ghosts = []; path = []; shake = 7;
    history = [];   // old snapshots refer to ghosts that no longer exist
    const oldRate = rate;
    setLevel(level + 1);
    banner = { text: `LEVEL ${level}`, sub: `Board cleared +${bonus}` + (rate > oldRate ? ' · ghosts speed up' : ''), age: 0 };
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.18, 'triangle', 0.13), 60 + i * 70));
  }

  function die(i) {
    state = 'dead'; deadFor = 0; killer = i; shake = 16;
    snapshot();
    replay = { pos: 0, started: false, done: false, doneFor: 0 };
    syncUI();
    burst(player.x, player.y, '#ffffff', 40, 420);
    burst(player.x, player.y, `hsl(${ghostHue(i)},90%,65%)`, 24, 300);
    deathSound();
    if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) { /* unsupported */ } }
    if (tut && tut.step > 1) endTutorial();   // they have met a ghost; no need to repeat the guide
    const hadLooks = unlockedIds();
    newBest = score > best;
    if (newBest) { best = score; save(bestKey(mode, runDate), String(best)); }
    if (mode === 'levels' && level > bestLevel) { bestLevel = level; save('echo.level', String(level)); }
    if (mode === 'daily' && score > 0) bumpStreak(runDate);
    lastRun = { mode, score, level, echoes: ghosts.length, date: runDate };
    lastRun.newLooks = LOOKS.filter(l => l.ok() && !hadLooks.includes(l.id)).map(l => l.name);
    lastEntry = null;
    if (score > 0) {
      const entry = { id: Date.now(), name: playerName || 'YOU', score, level, echoes: ghosts.length };
      lastEntryKey = boardKey(mode, runDate);
      const board = tidyBoard([...loadBoard(lastEntryKey), entry]);
      save(lastEntryKey, JSON.stringify(board));
      // Highlights this player's row, which is their best run rather than necessarily this one.
      lastEntry = board.find(e => nameKey(e.name) === nameKey(entry.name)) || null;
    }
    postScore();
  }

  // ---------- overlay ----------
  const TAGLINE = "Grab the gem. Every gem leaves behind a ghost that replays the path you just took. Be quick to build your combo, and don't run into your past.";

  function refreshMenu() {
    modeButtons.forEach((b, i) => {
      const m = b.dataset.mode, top = getBest(m);
      b.classList.toggle('sel', m === mode);
      b.querySelector('b').textContent = (isTouch ? '' : `${i + 1} · `) + MODE_NAMES[m];
      b.querySelector('span').textContent =
        m === 'levels' ? (bestLevel ? `Best: level ${bestLevel} · ${top} pts` : 'Clear the board to reach the next level')
        : m === 'endless' ? (top ? `Best: ${top} pts` : 'One board, no breaks')
        : (top ? `Today: ${top} pts` : 'Same gems for everyone today') + (streakNow() ? ` · ${streakNow()}-day streak` : '');
    });
    renderLooks();
    elCta.textContent = isTouch ? `Tap to play ${MODE_NAMES[mode]}` : `Space to play ${MODE_NAMES[mode]}`;
    elHelp.textContent = isTouch
      ? 'Drag to move · double-tap to dash through ghosts'
      : 'Arrows or WASD to move · Space to dash · P to pause · M to mute';
    renderBoard();
  }

  function renderBoard() {
    // After a daily run keep showing that run's day, even if midnight has passed since.
    const date = state === 'dead' && lastRun && lastRun.mode === mode ? lastRun.date : today();
    const remote = REMOTE ? remoteBoard(mode, date) : null;
    const board = remote || loadBoard(boardKey(mode, date));
    const label = mode === 'daily' ? `Daily ${date}` : MODE_NAMES[mode];
    elBoard.hidden = board.length === 0 && !REMOTE;   // the global board always shows, so a name can be entered
    elRows.hidden = board.length === 0;
    elTagline.hidden = board.length > 0;
    elBoardTitle.textContent = label + (
      remote ? (board.length ? ' · global top scores' : ' · no scores yet, be the first')
      : !REMOTE ? ' · top scores on this device'
      : remoteCache[boardKey(mode, date)].failed ? ' · this device (global board unreachable)'
      : ' · loading global scores…');
    elNote.hidden = !REMOTE || playerName.length >= MIN_NAME;
    elNote.textContent = `Add a name of ${MIN_NAME}+ letters to post your scores to the global board.`;
    if (!board.length) return;
    const mine = remote ? (playerName ? board.findIndex(e => nameKey(e.name) === nameKey(playerName)) : -1)
      : state === 'dead' && lastEntry ? board.findIndex(e => e.id === lastEntry.id) : -1;
    const shown = board.slice(0, BOARD_SHOW).map((e, i) => [e, i]);
    if (mine >= BOARD_SHOW) shown[BOARD_SHOW - 1] = [board[mine], mine];   // always keep this run in view
    elRows.textContent = '';
    for (const [e, i] of shown) {
      const li = document.createElement('li');
      if (i === mine) li.className = 'me';
      const cells = [['rank', i + 1], ['name', e.name], ['pts', e.score], ['detail', mode === 'levels' ? `level ${e.level}` : `${e.echoes} echoes`]];
      for (const [cls, text] of cells) {
        const span = document.createElement('span');
        span.className = cls; span.textContent = text;
        li.appendChild(span);
      }
      elRows.appendChild(li);
    }
  }

  elName.value = playerName;
  // Posting waits for the name to be finished (Enter or leaving the box), so half-typed names never reach the board.
  elName.addEventListener('change', () => { postScore(); renderBoard(); });
  elName.addEventListener('input', () => {
    playerName = elName.value.trim().slice(0, 10);
    save('echo.name', playerName);
    if (lastEntry) {   // renaming also relabels this player's row, merging with any row already under that name
      const name = playerName || 'YOU';
      let board = loadBoard(lastEntryKey);
      const e = board.find(x => x.id === lastEntry.id);
      if (e) {
        e.name = name;
        board = tidyBoard(board);
        save(lastEntryKey, JSON.stringify(board));
        lastEntry = board.find(x => nameKey(x.name) === nameKey(name)) || null;
      }
    }
    renderBoard();
  });
  function selectMode(m) {
    mode = m;
    save('echo.mode', m);
    refreshMenu();
  }
  modeButtons.forEach(b => b.addEventListener('click', () => { b.blur(); selectMode(b.dataset.mode); tryStart(); }));

  function renderLooks(noteFor) {
    elSwatches.textContent = '';
    for (const l of LOOKS) {
      const b = document.createElement('button'), open = l.ok();
      b.style.setProperty('--c', l.color);
      b.className = (l === look ? 'sel ' : '') + (open ? '' : 'locked');
      b.setAttribute('aria-label', open ? `${l.name} look` : `${l.name} look, locked`);
      b.addEventListener('click', () => {
        if (open) { look = l; save('echo.look', l.id); renderLooks(); }
        else renderLooks(l);
      });
      elSwatches.appendChild(b);
    }
    elLookNote.textContent = noteFor ? `${noteFor.name} is locked: ${noteFor.need}.` : `Look: ${look.name}`;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  // Hands a friend a link that opens the game with this run's score as the target to beat.
  elChallenge.addEventListener('click', async () => {
    elChallenge.blur();
    const r = lastRun;
    if (!r) return;
    const who = encodeURIComponent((playerName || 'A friend').replace(/[^\w \-]/g, ''));
    const url = location.origin + location.pathname + `#beat=${r.mode}.${r.mode === 'daily' ? r.date + '.' : ''}${r.score}.${who}`;
    const text = `Can you beat my ${r.score} in ECHO ${MODE_NAMES[r.mode]}?`;
    if (navigator.share) {
      try { await navigator.share({ text, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }   // closed the share sheet; anything else falls back to copying
    }
    elChallenge.textContent = await copyText(`${text} ${url}`) ? 'Link copied. Paste it to a friend' : 'Could not copy the link';
  });

  function showTitle() {
    const c = activeChallenge();
    elResult.textContent = '';
    elNews.hidden = !c && !challengeExpired;
    elNews.textContent = c ? `${c.name} challenges you: beat ${c.score} in ${MODE_NAMES[c.mode]}.`
      : challengeExpired ? "That daily challenge was for an earlier day. Today's daily is ready." : '';
    elChallenge.hidden = true;
    elTagline.textContent = TAGLINE;
    overlay.classList.remove('over');
    refreshMenu();
    overlay.classList.remove('hidden');
  }
  function showGameOver() {
    if (state !== 'dead' || overShown) return;
    overShown = true; overAt = deadFor;
    const r = lastRun, echoWord = r.echoes === 1 ? 'echo' : 'echoes';
    const what = r.mode === 'levels' ? `level ${r.level}` : r.mode === 'daily' ? `daily ${r.date}` : 'endless';
    elResult.innerHTML = `<b>${r.score}</b> pts · ${what}` + (newBest && r.score > 0 ? ' — new best!' : '');
    elTagline.textContent = r.score === 0
      ? 'Grab the gem to begin. Each one leaves a ghost of the path you took.'
      : `You were caught by your own past, with ${r.echoes} ${echoWord} on the board.`;
    const news = [];
    const c = challenge && challenge.mode === r.mode ? challenge : null;
    if (c && r.score > c.score) {
      news.push(`You beat ${c.name}'s ${c.score}. Send one back.`);
      challenge = null;
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* not allowed here */ }
    } else if (c) {
      news.push(`${c.name}'s ${c.score} still stands. You were ${c.score - r.score + 1} short.`);
    }
    if (r.newLooks.length) news.push(`New look unlocked: ${r.newLooks.join(', ')}.`);
    elNews.hidden = news.length === 0;
    elNews.textContent = news.join(' ');
    elChallenge.textContent = 'Challenge a friend';
    elChallenge.hidden = r.score === 0;
    overlay.classList.add('over');
    refreshMenu();
    overlay.classList.remove('hidden');
  }

  // ---------- intro ----------
  // The white ball runs in from the left and loops the screen with ghosts replaying its path
  // behind it, then spirals into the title's spot, where the ghosts pile in and become its echoes.
  const INTRO_GHOSTS = 5, INTRO_DELAY = 0.13, INTRO_LOOP = 1.0, INTRO_SPIRAL = 0.5;
  const elTitle = overlay.querySelector('h1');
  let intro = null;

  function startIntro() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    state = 'intro';
    overlay.classList.add('intro');
    elTitle.style.setProperty('--e', '0');
    intro = { t0: performance.now(), hits: -1, geo: null, revealAt: Infinity };
  }
  function introGeo() {
    const box = elTitle.getBoundingClientRect();
    const R = Math.min(vw, vh) * 0.36, v = TAU * R / INTRO_LOOP, tEnter = (vw / 2 + 40) / v;
    return { cx: vw / 2, cy: vh / 2, hx: box.left + box.width / 2, hy: box.top + box.height / 2, R, v, tEnter, tEnd: tEnter + INTRO_LOOP + INTRO_SPIRAL };
  }
  // Where the ball is t seconds in. Ghosts use the same path, a little later.
  function introPos(t, g) {
    if (t < g.tEnter) return [-40 + g.v * t, g.cy + g.R];
    const s = t - g.tEnter, th = Math.PI / 2 - TAU * s / INTRO_LOOP;
    const p = Math.max(0, Math.min(1, (s - INTRO_LOOP) / INTRO_SPIRAL)), e = p * p * (3 - 2 * p), r = g.R * (1 - p);
    return [g.cx + (g.hx - g.cx) * e + r * Math.cos(th), g.cy + (g.hy - g.cy) * e + r * Math.sin(th)];
  }
  function revealMenu() {
    overlay.classList.remove('intro');
    elTitle.classList.remove('show');
    elTitle.style.setProperty('--e', '1');
    if (state === 'intro') state = 'title';
  }
  function endIntro() { revealMenu(); intro = null; particles.length = 0; }

  function drawIntro() {
    const g = intro.geo || (intro.geo = introGeo()), t = (performance.now() - intro.t0) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, vw, vh);

    // Ghosts first, so the ball stays on top. Each one that reaches the centre lands as an echo.
    for (let k = INTRO_GHOSTS; k >= 0; k--) {
      const tk = t - k * INTRO_DELAY, color = k ? `hsl(${ghostHue(k - 1)},90%,62%)` : '#ffffff';
      if (tk >= g.tEnd) {
        if (k > intro.hits) {
          intro.hits = k;
          burst(g.hx, g.hy, color, k ? 16 : 30, k ? 300 : 380);
          if (k === 0) elTitle.classList.add('show');
          elTitle.style.setProperty('--e', String(k / INTRO_GHOSTS));
          if (k === INTRO_GHOSTS) intro.revealAt = t + 0.3;
        }
        continue;
      }
      ctx.fillStyle = color;
      for (let j = 12; j >= 1; j--) {
        const [x, y] = introPos(tk - j * 0.012, g);
        ctx.globalAlpha = 0.22 * (1 - j / 13);
        circle(x, y, 12 * (1 - j / 20)); ctx.fill();
      }
      const [x, y] = introPos(tk, g);
      ctx.globalAlpha = 0.2;
      circle(x, y, 23); ctx.fill();
      ctx.globalAlpha = 1;
      circle(x, y, 12); ctx.fill();
    }

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      circle(p.x, p.y, 3.4 * (1 - p.age / p.life) + 0.6); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (t >= intro.revealAt && state === 'intro') revealMenu();
    if (t >= intro.revealAt + 1 || t > 8) endIntro();   // let the last sparks fade, then hand over to the normal scene
  }

  // ---------- rendering ----------
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

  function draw() {
    if (intro) { drawIntro(); return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, vw, vh);

    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx), dpr * (oy + sy));

    // During the replay the camera pushes in on the spot where the run ended.
    const rv = replayView();
    if (rv) {
      const z = 1 + 0.55 * rv.prog * rv.prog;
      ctx.translate(player.x * (1 - z), player.y * (1 - z));
      ctx.scale(z, z);
    }
    const gemX = rv ? rv.a.gemX : gem.x, gemY = rv ? rv.a.gemY : gem.y;

    // Arena
    ctx.fillStyle = '#0c0e17';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 60; x < W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 60; y < H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    // Score watermark
    if (state !== 'title') {
      const size = Math.min(W, H) * 0.5 * (1 + scorePop * 0.12);
      ctx.font = `800 ${size}px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(255,255,255,${0.05 + scorePop * 0.06})`;
      ctx.fillText(String(score), W / 2, H / 2 + size * 0.04);
      ctx.font = '600 15px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillText(mode === 'levels' ? `LEVEL ${level} · ${levelGems}/${gemsNeeded()}`
        : mode === 'daily' ? `DAILY ${runDate}` : 'ENDLESS', 14, 12);
      ctx.textBaseline = 'bottom';
      const target = activeChallenge();
      if (target) ctx.fillStyle = '#ffd166';
      ctx.fillText(!target ? `BEST ${Math.max(best, score)}`
        : score > target.score ? `AHEAD OF ${target.name.toUpperCase()}` : `BEAT ${target.score} · ${target.name.toUpperCase()}`, 14, H - 10);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.textBaseline = 'top';
      if (mult > 1) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd166';
        ctx.fillText(`COMBO ×${mult}`, W / 2, 12);
      }
    }

    // Gem
    if (state !== 'title') {
      const t = time - gem.born, grow = Math.min(1, t * 5), pulse = 1 + Math.sin(time * 6) * 0.12;
      const r = GEM_R * grow * pulse;
      ctx.fillStyle = 'rgba(255,209,102,.13)';
      circle(gemX, gemY, r * 2.6); ctx.fill();
      if (state === 'play' && !gem.expired) {
        // Draining ring: grab the gem before it empties to raise the combo
        ctx.strokeStyle = 'rgba(255,209,102,.75)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(gemX, gemY, GEM_R * 2.5, -TAU / 4, -TAU / 4 + TAU * gem.left / gem.limit); ctx.stroke();
      }
      ctx.save();
      ctx.translate(gemX, gemY); ctx.rotate(time * 1.5);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.moveTo(0, -r * 1.25); ctx.lineTo(r, 0); ctx.lineTo(0, r * 1.25); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.moveTo(0, -r * 1.25); ctx.lineTo(r, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // Ghosts
    const ghostCount = rv ? rv.a.gs.length / 4 : ghosts.length;
    for (let i = 0; i < ghostCount; i++) {
      const g = ghosts[i], hue = ghostHue(i), p = g.path;
      let gx = g.x, gy = g.y, spawn = g.spawn, gt = g.t;
      if (rv) {
        const a = rv.a.gs, b = rv.b.gs, o = i * 4;
        gx = a[o]; gy = a[o + 1]; spawn = a[o + 2]; gt = a[o + 3];
        // Blend towards the next snapshot unless the ghost respawns in between.
        if (spawn <= 0 && b[o + 2] <= 0 && Math.hypot(b[o] - gx, b[o + 1] - gy) < 60) {
          gx += (b[o] - gx) * rv.f; gy += (b[o + 1] - gy) * rv.f;
        }
      }
      if (spawn > 0) {
        // Harmless warning ring that closes in on the spot where the ghost will appear
        const k = Math.min(1, spawn / spawnTime);
        ctx.strokeStyle = `hsla(${hue},90%,65%,${0.9 - k * 0.6})`;
        ctx.lineWidth = 2;
        circle(gx, gy, R + k * 26); ctx.stroke();
        ctx.fillStyle = `hsla(${hue},90%,65%,${(1 - k) * 0.5})`;
        circle(gx, gy, R * (1 - k)); ctx.fill();
        continue;
      }
      for (let k = 1; k <= 6; k++) {
        const j = (Math.floor(gt) - k * 4) * 2;
        if (j < 0) break;
        ctx.fillStyle = `hsla(${hue},90%,62%,${0.2 * (1 - k / 7)})`;
        circle(p[j], p[j + 1], R * (1 - k / 9)); ctx.fill();
      }
      ctx.fillStyle = `hsla(${hue},90%,62%,.18)`;
      circle(gx, gy, R * 1.9); ctx.fill();
      ctx.fillStyle = `hsl(${hue},90%,62%)`;
      circle(gx, gy, R); ctx.fill();
      if (state === 'dead' && i === killer) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
        circle(gx, gy, R + 7 + Math.sin(time * 14) * 2.5); ctx.stroke();
      }
    }

    // Player
    if (state === 'play') {
      for (let j = 0; j < trail.length; j += 2) {
        const k = j / trail.length;
        ctx.globalAlpha = k * (look.id === 'classic' ? 0.16 : 0.34);
        ctx.fillStyle = look.color;
        circle(trail[j], trail[j + 1], R * (0.35 + k * 0.6)); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (rv) {
      const idx = Math.floor(replay.pos);
      for (let k = 12; k >= 1; k--) {
        const h = history[idx - k];
        if (!h) continue;
        ctx.fillStyle = `rgba(255,255,255,${0.16 * (1 - k / 13)})`;
        circle(h.px, h.py, R * (1 - k / 20)); ctx.fill();
      }
    }
    if (state !== 'dead' || rv) {
      const dashing = rv ? rv.a.dash : safeT > 0;
      const px = rv ? rv.a.px + (rv.b.px - rv.a.px) * rv.f : player.x;
      const py = rv ? rv.a.py + (rv.b.py - rv.a.py) * rv.f : player.y;
      ctx.globalAlpha = dashing ? 0.3 : look.id === 'classic' ? 0.16 : 0.3;
      ctx.fillStyle = dashing ? CYAN : look.color;
      circle(px, py, R * (dashing ? 2.8 : 2)); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      circle(px, py, R); ctx.fill();
      if (look.id !== 'classic') {
        ctx.strokeStyle = look.color; ctx.lineWidth = 3.5;
        circle(px, py, R - 1.75); ctx.stroke();
      }
      if (state === 'play') {
        // Dash cooldown ring: faint and full when ready, refilling otherwise
        const ready = dashCd <= 0;
        ctx.strokeStyle = ready ? 'rgba(127,231,255,.45)' : 'rgba(127,231,255,.9)';
        ctx.lineWidth = ready ? 1.5 : 2.5;
        ctx.beginPath(); ctx.arc(player.x, player.y, R + 6, -TAU / 4, -TAU / 4 + TAU * (1 - dashCd / DASH_CD)); ctx.stroke();
      }
    }

    // Floating score text
    ctx.font = '700 17px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = 1 - f.age / 0.9;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, Math.max(50, Math.min(W - 50, f.x)), Math.max(14, f.y));
    }
    ctx.globalAlpha = 1;

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      circle(p.x, p.y, 3.2 * (1 - p.age / p.life) + 0.6); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Level / mode banner
    if (banner && state === 'play') {
      ctx.globalAlpha = Math.max(0, Math.min(1, banner.age * 5, (2.2 - banner.age) * 2));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = '800 56px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText(banner.text, W / 2, H * 0.24);
      ctx.fillStyle = '#ffd166';
      ctx.font = '600 17px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText(banner.sub, W / 2, H * 0.24 + 44);
      ctx.globalAlpha = 1;
    }

    if (rv) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.35 * Math.sin(time * 9)})`;
      ctx.font = '800 16px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText('◀◀  REPLAY', vw / 2, Math.max(34, oy + 34));
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.font = '600 13px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText(isTouch ? 'Tap to skip' : 'Space to skip', vw / 2, Math.min(vh - 26, oy + H * scale - 26));
    }

    if (tut && state === 'play' && !paused) {
      const g0 = ghosts[0];
      const at = tut.step === 2 && g0 ? g0 : tut.step === 4 ? player : gem;
      const tx = ox + at.x * scale, ty = oy + at.y * scale, lines = TUT_LINES[tut.step];
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = `rgba(255,255,255,${0.55 + 0.35 * Math.sin(time * 7)})`; ctx.lineWidth = 2;
      circle(tx, ty, 24 + 3 * Math.sin(time * 7)); ctx.stroke();
      ctx.font = '700 15px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width) + 24, h = 50;
      const bx = Math.max(8, Math.min(vw - w - 8, tx - w / 2));
      const by = ty - 38 - h > 8 ? ty - 38 - h : ty + 38;   // above the target, or below when there is no room
      ctx.fillStyle = 'rgba(7,8,13,.88)';
      ctx.beginPath(); ctx.rect(bx, by, w, h); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText(lines[0], bx + w / 2, by + 16);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(lines[1], bx + w / 2, by + 35);
    }

    if (paused) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgba(7,8,13,.66)';
      ctx.fillRect(0, 0, vw, vh);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = '800 44px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText('PAUSED', vw / 2, vh / 2 - 14);
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.font = '600 15px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif';
      ctx.fillText(isTouch ? 'Tap to resume' : 'Press P or Space to resume', vw / 2, vh / 2 + 26);
    }
  }

  // ---------- main loop ----------
  let last = 0, acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now; acc += dt;
    while (acc >= STEP) { step(); acc -= STEP; }
    musicTick();
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- add to home screen ----------
  // Android and desktop Chrome offer a real install prompt; iPhones only allow it from the Share menu.
  let installEvent = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && !standalone) elInstall.hidden = false;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; elInstall.hidden = false; });
  addEventListener('appinstalled', () => { installEvent = null; elInstall.hidden = true; });
  elInstall.addEventListener('click', async () => {
    elInstall.blur();
    if (installEvent) {
      installEvent.prompt();
      try { await installEvent.userChoice; } catch (e) { /* dismissed */ }
      installEvent = null; elInstall.hidden = true;
    } else {
      elInstall.textContent = 'In Safari: tap Share, then "Add to Home Screen"';
    }
  });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline play is a bonus */ });
  }

  addEventListener('resize', layout);
  reset();
  showTitle();
  startIntro();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
